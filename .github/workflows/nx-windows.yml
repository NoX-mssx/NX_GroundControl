name: NX Windows

# Lean replacement for windows.yml on this fork: AMD64 only, and it follows the custom app name instead
# of the hardcoded QGroundControl.exe paths the upstream workflow verifies.

on:
  push:
    branches:
      - rover
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
  APP_NAME: NX-GroundControl

jobs:
  build:
    name: Build installer
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          extra-args: -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          output-file: ${{ runner.temp }}/build-output.txt

      # Surfaces the compiler errors as an annotation on the run, readable without downloading the log.
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $log = "${{ runner.temp }}\build-output.txt"
          if (-not (Test-Path $log)) {
            Write-Host "::error::Build output file not found"
            exit 0
          }
          $lines = Get-Content $log
          $errors = @($lines | Select-String -Pattern 'error C\d+|error LNK\d+|fatal error|: error|Error:|FAILED:' | Select-Object -First 40 | ForEach-Object { $_.Line })
          if ($errors.Count -eq 0) {
            $errors = @($lines | Select-Object -Last 40)
          }
          $message = ($errors -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Host "::error title=Build errors::$message"

      - name: Create Installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Install and verify installer
        shell: pwsh
        run: |
          $installerExe = Get-ChildItem -Path "${{ runner.temp }}\build" -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installerExe) {
            Write-Error "Installer .exe not found"
            exit 1
          }
          $installDir = "${{ runner.temp }}\nx-install-test"
          Start-Process -FilePath $installerExe.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow
          $binary = Join-Path $installDir "bin\$env:APP_NAME.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "$binary not found after install"
            Get-ChildItem -Path $installDir -Recurse | Select-Object FullName
            exit 1
          }
          $pluginCount = (Get-ChildItem -Path (Join-Path $installDir "lib\gstreamer-1.0") -Filter "*.dll" | Measure-Object).Count
          Write-Host "GStreamer plugins found: $pluginCount"
          if ($pluginCount -eq 0) {
            Write-Error "No GStreamer plugin DLLs installed"
            exit 1
          }
          "INSTALLER_PATH=$($installerExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Loads the stream elements the app needs from the installed copy, the same way the app does,
      # and reports the result as annotations on the run.
      - name: Check installed GStreamer elements
        shell: pwsh
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: |
          $installDir = "${{ runner.temp }}\nx-install-test"
          $binDir = Join-Path $installDir "bin"
          $pluginDir = Join-Path $installDir "lib\gstreamer-1.0"
          # Run from the installed bin so the DLLs come from the installer, not from the SDK.
          $inspect = Join-Path $binDir "nx-gst-inspect.exe"
          Copy-Item (Join-Path $env:GST_ROOT "bin\gst-inspect-1.0.exe") $inspect
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = $pluginDir
          $env:GST_PLUGIN_PATH_1_0 = ""
          $env:GST_REGISTRY_1_0 = Join-Path "${{ runner.temp }}" "nx-gst-registry.bin"
          $scanner = Join-Path $installDir "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          if (Test-Path $scanner) { $env:GST_PLUGIN_SCANNER_1_0 = $scanner }
          $missing = @()
          foreach ($element in @("srtsrc", "tsdemux", "rtspsrc", "parsebin", "decodebin3", "h264parse", "h265parse", "avdec_h264", "avdec_h265", "avdec_aac", "autoaudiosink")) {
            & $inspect --exists $element
            if ($LASTEXITCODE -ne 0) { $missing += $element }
          }
          Remove-Item $inspect
          $plugins = (Get-ChildItem -Path $pluginDir -Filter "gst*.dll" | ForEach-Object { $_.BaseName }) -join " "
          $srtLibs = (Get-ChildItem -Path $binDir -Filter "*srt*.dll" | ForEach-Object { $_.Name }) -join " "
          Write-Host "::notice title=GStreamer plugins::$plugins"
          Write-Host "::notice title=SRT libraries::$srtLibs"
          if ($missing.Count -gt 0) {
            Write-Host "::warning title=GStreamer elements not loadable::$($missing -join ' ')"
          } else {
            Write-Host "::notice title=GStreamer elements::all stream elements load"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-installer-AMD64
          path: ${{ env.INSTALLER_PATH }}
          compression-level: 0
          retention-days: 30
